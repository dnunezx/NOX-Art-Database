name: NOX — Review Artwork
on:
  workflow_dispatch:
    inputs:
      title_ids:
        description: Title IDs you reviewed, separated by spaces or commas
        required: true
      decision:
        description: Your visual review decision
        type: choice
        options: [approve, reject]
        default: approve
permissions:
  contents: write
concurrency:
  group: fetch-${{ github.ref }}
  cancel-in-progress: false
jobs:
  review:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Record your review and update the gallery
        env:
          NOX_REVIEW_IDS: ${{ inputs.title_ids }}
          NOX_REVIEW_DECISION: ${{ inputs.decision }}
        run: python -m scripts.apply_review
      - run: python -m scripts.commit_updates
