name: Generate Artwork
on:
  workflow_dispatch:
    inputs:
      limit:
        description: Maximum games per run (1-1000)
        default: '50'
        required: true
      refresh:
        description: Refresh provider caches and detect changed sources
        type: boolean
        default: false
      replace:
        description: Explicitly approved replacement Title IDs, separated by spaces
        default: ''
  push:
    paths:
      - database/games.json
      - config.json
      - sources/**
      - noxart/**
      - providers/**
      - scripts/**
      - tests/**
      - requirements.txt
      - .github/workflows/generate-artwork.yml
  schedule:
    - cron: '17 7 * * 1'
permissions:
  contents: read
concurrency:
  group: generate-${{ github.ref }}
  cancel-in-progress: false
jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -v
      - name: Restore provider metadata cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .cache/metadata
          key: provider-metadata-${{ runner.os }}-${{ github.run_id }}
          restore-keys: provider-metadata-${{ runner.os }}-
      - name: Fetch and generate bounded batch
        env:
          STEAMGRIDDB_API_KEY: ${{ secrets.STEAMGRIDDB_API_KEY }}
          NOX_LIMIT: ${{ inputs.limit || '50' }}
          NOX_REFRESH: ${{ inputs.refresh || 'false' }}
          NOX_REPLACE: ${{ inputs.replace || '' }}
        run: python -m scripts.run_pipeline
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: nox-artwork-${{ github.run_number }}
          path: |
            dist/nox-artwork.zip
            dist/SHA256SUMS
            reports/
            database/artwork_manifest.json
          if-no-files-found: error
          retention-days: 14
      - name: Propose database updates
        if: github.ref_name == github.event.repository.default_branch
        uses: peter-evans/create-pull-request@22a9089034f40e5a961c8808d113e2c98fb63676 # v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: automation/artwork-update
          title: 'Update NOX artwork database'
          commit-message: 'Update generated artwork and provenance'
          body-path: reports/review.md
          add-paths: |
            database/
            artwork/
            thumbnails/
            reports/
