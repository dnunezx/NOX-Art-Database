name: Validate Artwork
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -v
      - run: python -m scripts.validate_artwork
      - run: python -m scripts.check_public
      - run: python -m scripts.build_database --check
      - run: python -m scripts.generate_report
      - run: python -m scripts.publish_individual
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: validated-nox-artwork
          path: |
            art/
            thumbnails/
            reports/
            database/
          if-no-files-found: error
          retention-days: 14
